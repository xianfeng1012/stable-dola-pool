<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dola-pool 管理面板</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--line:#e5e9e8;--text:#1f2a28;--sub:#7a8a86;--accent:#00a870;--accent-d:#008e5d;--red:#e5484d;--orange:#f59e0b;--blue:#3b82f6;--gray:#9aa8a4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
a{color:var(--accent);text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.head-r{display:flex;align-items:center;gap:14px;color:var(--sub);font-size:13px}
.head-r label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
nav{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--line);background:var(--bg)}
nav button{border:none;background:none;padding:10px 16px;font-size:14px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:20px;max-width:1180px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{font-size:14px;margin-bottom:14px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{padding:16px;border-radius:12px;color:#fff;display:flex;flex-direction:column;gap:6px}
.stat .v{font-size:28px;font-weight:700}
.stat .l{font-size:13px;opacity:.85}
.s1{background:linear-gradient(135deg,#00b875,#00945f)}.s2{background:linear-gradient(135deg,#e5484d,#b93237)}
.s3{background:linear-gradient(135deg,#3b82f6,#2563eb)}.s4{background:linear-gradient(135deg,#f59e0b,#d97706)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
th{color:var(--sub);font-weight:500;white-space:nowrap}
td .prompt{display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.b-green{background:#e6f7f0;color:#00945f}.b-red{background:#fdeaea;color:#c03237}
.b-orange{background:#fef4e6;color:#c77a00}.b-blue{background:#e8f1fe;color:#2563eb}
.b-gray{background:#eef1f0;color:#7a8a86}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-p{background:var(--accent);color:#fff;border:none}
.btn-p:hover{background:var(--accent-d);color:#fff}
.btn-danger{color:#c03237}
.btn-danger:hover{border-color:#e5484d;color:#e5484d}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar .hint{color:var(--sub);font-size:12px}
.sw{position:relative;display:inline-block;width:36px;height:20px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#cfd8d5;border-radius:999px;transition:.2s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:before{transform:translateX(16px)}
.mask{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.mask .box{background:#fff;border-radius:14px;padding:28px;width:320px}
.mask h2{font-size:17px;margin-bottom:18px}
.mask input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;font-size:14px}
.mask .err{color:#c03237;font-size:12px;margin-bottom:10px;display:none}
.mask button{width:100%}
.dialog{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:center;justify-content:center;z-index:90}
.dialog .box{background:#fff;border-radius:14px;padding:24px;width:400px;max-width:92vw;max-height:86vh;overflow:auto}
.dialog h2{font-size:16px;margin-bottom:16px}
.dialog label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.dialog input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.keyfull{font-family:monospace;background:#f5f7f6;border:1px dashed var(--line);border-radius:8px;padding:12px;word-break:break-all;margin:10px 0}
.chart{display:flex;align-items:flex-end;gap:14px;height:140px;padding:0 4px}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:4px;align-items:flex-end;height:110px}
.chart .bar{border-radius:3px 3px 0 0;width:16px}
.chart .lbl{font-size:11px;color:var(--sub)}
.empty{padding:34px;text-align:center;color:var(--sub)}
.video-wrap{display:flex;gap:8px;align-items:center}
.tiny{font-size:12px;color:var(--sub)}
.account-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#52615d;font-weight:600}
</style>
</head>
<body>
<div id="loginMask" class="mask" style="display:none">
  <div class="box">
    <h2>管理面板登录</h2>
    <input id="loginUser" placeholder="用户名" autocomplete="username" onkeydown="if(event.key==='Enter')q('#loginPassword').focus()">
    <input id="loginPassword" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitLogin()">
    <div class="err" id="loginErr">用户名或密码错误</div>
    <button class="btn btn-p" onclick="submitLogin()">登录</button>
  </div>
</div>

<header>
  <div class="brand"><span class="dot"></span>dola-pool 管理面板</div>
  <div class="head-r">
    <label><input type="checkbox" id="autoCk" checked onchange="autoRefresh=this.checked">自动刷新</label>
    <span id="lastUpdate"></span>
    <button class="btn" onclick="refresh()">刷新</button>
    <button class="btn btn-p" onclick="openStress()">压力测试</button>
    <button class="btn" onclick="logout()" title="清除面板密码">注销</button>
  </div>
</header>

<nav>
  <button class="on" data-tab="dash" onclick="switchTab('dash')">仪表盘</button>
  <button data-tab="accounts" onclick="switchTab('accounts')">账号管理</button>
  <button data-tab="proxies" onclick="switchTab('proxies')">代理管理</button>
  <button data-tab="tasks" onclick="switchTab('tasks')">任务列表</button>
  <button data-tab="videos" onclick="switchTab('videos')">视频管理</button>
  <button data-tab="keys" onclick="switchTab('keys')">API 密钥</button>
  <button data-tab="users" onclick="switchTab('users')">用户管理</button>
</nav>

<main>
  <section id="tab-dash">
    <div class="cards" id="statCards"></div>
    <div class="card"><h3>近 7 日出片趋势</h3><div class="chart" id="chart"></div></div>
    <div class="card"><h3>号池概况</h3><div id="perAccount"></div></div>
  </section>

  <section id="tab-accounts" style="display:none">
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0">账号列表</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-danger" id="btnDelSel" onclick="delSelected()" disabled>删除选中</button>
          <button class="btn" onclick="openBatchAdd()">＋ 批量添加</button>
          <button class="btn btn-p" onclick="openAddAccount()">＋ 添加账号</button>
        </div>
      </div>
      <div id="accountsTable"></div>
    </div>
  </section>

  <section id="tab-proxies" style="display:none">
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0">代理列表</h3>
        <button class="btn btn-p" onclick="openAddProxy()">＋ 添加代理</button>
      </div>
      <div class="hint" style="margin-bottom:12px">
        可添加多个 HTTP/SOCKS 代理；在“账号管理 → 操作 → 代理”里给每个账号手动选择。
        未给账号指定代理时，使用环境变量默认代理
        <span id="defaultProxyShow" style="font-family:monospace"></span>。
      </div>
      <div id="proxiesTable"></div>
    </div>
  </section>

  <section id="tab-tasks" style="display:none">
    <div class="card"><h3>任务列表（最近 50 条）</h3><div id="tasksTable"></div></div>
  </section>

  <section id="tab-videos" style="display:none">
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0">视频管理（已生成的视频）</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-danger" id="btnDelVideos" onclick="delSelectedVideos()" disabled>删除选中</button>
          <button class="btn" onclick="loadVideos()">刷新</button>
        </div>
      </div>
      <div id="videoStat" style="margin:10px 0 6px;color:#888;font-size:13px">视频统计加载中…</div>
      <div id="videosTable"></div>
    </div>
  </section>

  <section id="tab-keys" style="display:none">
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0">API 密钥</h3>
        <button class="btn btn-p" onclick="openCreateKey()">＋ 创建密钥</button>
      </div>
      <div class="hint" style="margin-bottom:12px">每个 Key 可独立设置每日额度、并发数和允许时长；0 表示不限。环境变量里的 key 始终有效、不在此列表。</div>
      <div id="keysTable"></div>
    </div>
  </section>

  <section id="tab-users" style="display:none">
    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0">用户管理</h3>
        <button class="btn btn-p" onclick="openAddUser()">＋ 新增管理员</button>
      </div>
      <div class="hint" style="margin-bottom:12px">可增加/删除/修改子管理账号与密码；主账号 admin 不能删除或禁用。</div>
      <div id="usersTable"></div>
    </div>
  </section>
</main>

<div id="dlg" class="dialog" style="display:none"><div class="box" id="dlgBox"></div></div>
<div id="videoModal" class="dialog" style="display:none">
  <div class="box" style="width:640px">
    <h2>视频预览</h2>
    <video id="videoEl" controls autoplay style="width:100%;border-radius:8px"></video>
    <div class="row"><button class="btn" onclick="closeVideo()">关闭</button></div>
  </div>
</div>

<script>
const LS_KEY='dola_admin_key';
let adminKey=localStorage.getItem(LS_KEY)||'';
let autoRefresh=true, curTab='dash', timer=null;

function q(s){return document.querySelector(s);}
function show(id){document.getElementById(id).style.display='flex';}
function hide(id){document.getElementById(id).style.display='none';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(ts){if(!ts)return '-';const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtHM(ts){const d=new Date(ts*1000);const p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())}`;}

async function api(path,opts={}){
  const r=await fetch(path,{method:opts.method||'GET',headers:{'Content-Type':'application/json','X-Admin-Key':adminKey,...(opts.headers||{})},body:opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===401){showLogin();throw new Error('unauthorized');}
  const text=await r.text();
  let data={};try{data=text?JSON.parse(text):{};}catch(e){}
  if(!r.ok)throw new Error(data.detail||(`${r.status} ${text.slice(0,120)}`));
  return data;
}

function showLogin(){hide('dlg');show('loginMask');q('#loginErr').style.display='none';}
async function submitLogin(){
  const username=q('#loginUser').value.trim();
  const password=q('#loginPassword').value;
  if(!username||!password){q('#loginErr').style.display='block';return;}
  let r;
  try{r=await api('/api/admin/login',{method:'POST',body:{username,password}});}
  catch(e){q('#loginErr').style.display='block';return;}
  adminKey=r.token;localStorage.setItem(LS_KEY,r.token);
  hide('loginMask');refresh();
}
function logout(){adminKey='';localStorage.removeItem(LS_KEY);showLogin();}

function switchTab(t){
  curTab=t;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ['dash','accounts','proxies','tasks','videos','keys','users'].forEach(x=>{q('#tab-'+x).style.display=x===t?'block':'none';});
  refresh();
}

async function refresh(){
  if(q('#loginMask').style.display!=='none')return;
  q('#lastUpdate').textContent='更新于 '+new Date().toLocaleTimeString();
  try{
    if(curTab==='dash')await loadDash();
    else if(curTab==='accounts')await loadAccounts();
    else if(curTab==='proxies')await loadProxies();
    else if(curTab==='tasks')await loadTasks();
    else if(curTab==='videos')await loadVideos();
    else if(curTab==='keys')await loadKeys();
    else if(curTab==='users')await loadUsers();
  }catch(e){if(e.message!=='unauthorized'){/* 静默 */}}
}

/* ---- 仪表盘 ---- */
async function loadDash(){
  const st=await api('/api/admin/stats');
  const sr=st.success_rate==null?'—':(st.success_rate*100).toFixed(0)+'%';
  q('#statCards').innerHTML=`
    <div class="stat s1"><div class="v">${st.today_completed}</div><div class="l">今日出片</div></div>
    <div class="stat s2"><div class="v">${st.today_failed}</div><div class="l">今日失败</div></div>
    <div class="stat s3"><div class="v">${sr}</div><div class="l">成功率</div></div>
    <div class="stat s4"><div class="v">${st.available_accounts}/${st.total_accounts}</div><div class="l">可用号 · 剩余 ${st.total_remaining} 点</div></div>`;
  const max=Math.max(1,...st.per_day.map(d=>d.completed+d.failed));
  q('#chart').innerHTML=st.per_day.map(d=>`
    <div class="col">
      <div class="bars">
        <div class="bar" style="height:${Math.round(d.completed/max*100)}px;background:#00b875" title="出片 ${d.completed}"></div>
        <div class="bar" style="height:${Math.round(d.failed/max*100)}px;background:#e5484d" title="失败 ${d.failed}"></div>
      </div>
      <div class="lbl">${d.day}</div>
    </div>`).join('');
  q('#perAccount').innerHTML=table(
    ['账号','状态','调度','剩余额度','累计出片','最近使用'],
    st.per_account.map(a=>[
      accLabel(a),
      statusBadge(a),
      `<label class="sw"><input type="checkbox" ${a.scheduling?'checked':''} onchange="setSched('${a.name}',this.checked)"><i></i></label>`,
      `<b>${a.remaining}</b> / ${a.limit}<span class="tiny">（点数/上限）</span>`,
      a.completed_total||0,
      fmt(a.last_used_at)
    ])
  );
}

function accLabel(x){return x.email?`<div>${esc(x.email)}</div>`:'<span class="tiny">未录入邮箱</span>';}
function statusBadge(a){
  if(a.busy)return '<span class="badge b-blue">出片中</span>';
  if(a.rate_limited)return '<span class="badge b-orange">限流至 '+fmt(a.rate_limited_until)+'</span>';
  if(a.quota_blocked)return '<span class="badge b-orange">积分不足至 '+fmt(a.quota_blocked_until)+'</span>';
  if(a.cooling)return '<span class="badge b-orange">冷却至 '+fmtHM(a.cooldown_until)+'</span>';
  if(a.failed)return '<span class="badge b-red" title="'+esc(a.failed_reason||'生成失败')+'">失败(待全池重置)</span>';
  if(a.login_ok===0)return '<span class="badge b-red">失效</span>';
  if(a.login_ok===1)return '<span class="badge b-green">有效</span>';
  return '<span class="badge b-gray">未验证</span>';
}

function table(heads,rows){
  return `<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">暂无数据</td></tr>`}</tbody></table>`;
}

async function setSched(name,on){
  try{await api('/api/admin/accounts/'+name,{method:'PATCH',body:{scheduling:on}});}catch(e){alert(e.message);}refresh();
}

/* ---- 账号管理 ---- */
let selAccounts=new Set();
let allAccountNames=[];
let proxyCache=[];
async function loadAccounts(){
  const [a,j]=await Promise.all([api('/api/admin/accounts'),api('/api/admin/jobs')]);
  const jobs=j.jobs||{};
  allAccountNames=a.accounts.map(x=>x.name);
  const rows=a.accounts.map(x=>{
    const jb=jobs[x.name];
    const badge=(jb&&jb.kind==='add'&&jb.status==='running')?'<span class="badge b-blue">加号中</span>'
      :(jb&&jb.kind==='add'&&jb.status==='failed')?'<span class="badge b-red">加号失败</span>'
      :statusBadge(x);
    const warn=(jb&&jb.status==='failed')?' <span class="tiny" title="'+esc(jb.error)+'">⚠</span>':'';
    return [
      `<input type="checkbox" data-name="${esc(x.name)}" ${selAccounts.has(x.name)?'checked':''} onchange="toggleSel('${x.name}',this.checked)">`,
      `<span class="account-id">${esc(x.name)}</span>`,
      accLabel(x)+warn,
      badge,
      `<label class="sw"><input type="checkbox" ${x.scheduling?'checked':''} onchange="setSched('${x.name}',this.checked)"><i></i></label>`,
      `<b>${x.remaining}</b> / ${x.limit}`,
      fmt(x.last_used_at),
      fmt(x.created_at),
      `<button class="btn" style="margin-right:6px" onclick="verify('${x.name}',this)">验证</button>`+
      `<button class="btn" style="margin-right:6px" onclick="openSetAccountProxy('${x.name}','${x.proxy_id||''}')">${x.proxy_name?esc(x.proxy_name):'代理(默认)'}</button>`+
      `<button class="btn btn-danger" onclick="delAccount('${x.name}')">删除</button>`
    ];
  });
  q('#accountsTable').innerHTML=table(
    ['<input type="checkbox" id="selAll" onchange="toggleAll(this.checked)" title="全选/取消全选">',
     '内部账号','名称','状态','调度','剩余额度','最近使用','创建时间','操作'],rows);
  const b=q('#btnDelSel');b.disabled=selAccounts.size===0;
  b.textContent=selAccounts.size?`删除选中（${selAccounts.size}）`:'删除选中';
  const selAll=q('#selAll');
  if(selAll){
    selAll.checked=selAccounts.size>0&&selAccounts.size===allAccountNames.length;
    selAll.indeterminate=selAccounts.size>0&&selAccounts.size<allAccountNames.length;
  }
}

function toggleAll(on){
  selAccounts.clear();
  if(on)allAccountNames.forEach(n=>selAccounts.add(n));
  loadAccounts();
  const b=q('#btnDelSel');b.disabled=selAccounts.size===0;
  b.textContent=selAccounts.size?`删除选中（${selAccounts.size}）`:'删除选中';
}

async function verify(name,btn){
  btn.disabled=true;const old=btn.textContent;btn.textContent='验证中…';
  try{const r=await api('/api/admin/accounts/'+name+'/verify',{method:'POST'});
    alert(name+' 登录态：'+(r.ok?'有效✓':'失效✗'));
  }catch(e){alert(e.message);}
  btn.disabled=false;btn.textContent=old;refresh();
}

async function delAccount(name){
  if(!confirm('确定删除账号 '+name+'？将同时删除其 profile。'))return;
  try{await api('/api/admin/accounts/'+name,{method:'DELETE'});}catch(e){alert(e.message);}refresh();
}

function toggleSel(name,on){
  if(on)selAccounts.add(name);else selAccounts.delete(name);
  const b=q('#btnDelSel');b.disabled=selAccounts.size===0;
  b.textContent=selAccounts.size?`删除选中（${selAccounts.size}）`:'删除选中';
  const selAll=q('#selAll');
  if(selAll){
    selAll.checked=selAccounts.size>0&&selAccounts.size===allAccountNames.length;
    selAll.indeterminate=selAccounts.size>0&&selAccounts.size<allAccountNames.length;
  }
}

async function delSelected(){
  const list=[...selAccounts];
  if(!list.length)return;
  if(!confirm(`确定删除选中的 ${list.length} 个账号？将同时删除其 profile。`))return;
  let ok=0;
  for(const name of list){
    try{await api('/api/admin/accounts/'+encodeURIComponent(name),{method:'DELETE'});ok++;}
    catch(e){alert(name+' 删除失败：'+e.message);}
  }
  selAccounts.clear();
  refresh();
  if(ok)alert(`已删除 ${ok} 个账号`);
}

async function openSetAccountProxy(name,currentId){
  try{const r=await api('/api/admin/proxies');proxyCache=r.proxies||[];}catch(e){return alert(e.message);}
  const opts='<option value="">默认代理（DOLA_PROXY）</option>'+proxyCache.map(p=>

function buildRecord(f){
  if(!f || f.length<2)return null;
  // 只有 邮箱 密码 两字段（无账号名、无 TOTP）→ 自动命名 accN
  if(f.length===2 && f[0].includes('@')){
    return {name:null,email:f[0],password:f[1],totp:''};
  }
  if(f.length<3)return null;
  let name,email,password,totp='';
  if(f.length>=4 || /^acc\d+$/i.test(f[0]) || !f[0].includes('@')){
    name=f[0];email=f[1];password=f[2];totp=f[3]||'';
  }else{
    email=f[0];password=f[1];totp=f[2]||'';
  }
  return {name:name||null,email,password,totp};
}

function parseBatchInput(text){
  const out=[];
  let autoN=document.querySelectorAll('#accountsTable tbody tr').length;
  // 统一全角分隔符
  text=String(text||'').replace(/[，；｜]/g,c=>({'，':',','；':';','｜':'|'}[c]));
  // 先按换行/分号/逗号切成块
  const blocks=text.split(/[\n;,]/).map(s=>s.trim()).filter(Boolean);
  const pushRec=(f)=>{
    const rec=buildRecord(f);
    if(rec){ if(!rec.name) rec.name='acc'+(++autoN); out.push(rec); }
  };
  for(const block of blocks){
    // 1) 字段用 --- 分隔：邮箱---密码 / 账号名---邮箱---密码---TOTP
    if(block.includes('---')){
      pushRec(block.split(/---+/).map(s=>s.trim()).filter(Boolean));
      continue;
    }
    // 2) 字段用 | 分隔或一行内多个账号用 | 分隔
    const parts=block.split('|').map(s=>s.trim()).filter(Boolean);
    if(parts.length===1){
      // 纯空格格式：账号名 邮箱 密码 [TOTP]
      pushRec(parts[0].split(/\s+/).filter(Boolean));
    }else if(parts.length===2){
      // 邮箱|密码（两侧都无空格）→ 单账号；否则视为「账号1 | 账号2」两个账号
      if(!parts[0].includes(' ') && !parts[1].includes(' ')){
        pushRec(parts);
      }else{
        for(const part of parts) pushRec(part.split(/\s+/).filter(Boolean));
      }
    }else if(parts.length>=3 && parts.length<=4){
      // | 分隔字段的单个账号：账号名|邮箱|密码[|TOTP]
      pushRec(parts);
    }else{
      // 一行内多个账号用 | 分隔，每段是「账号名 邮箱 密码 [TOTP]」
      for(const part of parts) pushRec(part.split(/\s+/).filter(Boolean));
    }
  }
  return out;
}

async function submitBatchAdd(){
  const accounts=parseBatchInput(q('#f_batch').value);
  if(!accounts.length)return alert('未解析到任何账号，请检查格式（账号名 邮箱 密码 [TOTP]）');
  const btn=q('#dlg .btn-p');const res=q('#batchResult');
  btn.disabled=true;res.textContent='';
  const lines=[];
  const normEmail=e=>String(e||'').trim().toLowerCase();
  // 先拉取现有账号与进行中的加号任务，按邮箱剔除重复项
  let existing=[],jobs={};
  try{
    const [a,j]=await Promise.all([api('/api/admin/accounts'),api('/api/admin/jobs')]);
    existing=a.accounts||[];jobs=j.jobs||{};
  }catch(e){}
  const owner=new Map();
  existing.forEach(x=>{if(x.email&&!owner.has(normEmail(x.email)))owner.set(normEmail(x.email),x.name);});
  Object.entries(jobs).forEach(([name,job])=>{
    if(job.kind==='add'&&job.status==='running'&&job.email&&!owner.has(normEmail(job.email)))
      owner.set(normEmail(job.email),name+'（添加中）');
  });
  const nameTaken=new Set(existing.map(x=>x.name));
  const seen=new Map();
  const todo=[];const dups=[];
  accounts.forEach((a,idx)=>{
    const em=normEmail(a.email);
    let why='';
    if(nameTaken.has(a.name))why='账号名 '+a.name+' 已存在';
    else if(owner.has(em))why='邮箱重复（已存在 '+owner.get(em)+'）';
    else if(seen.has(em))why='本批内重复（第 '+(seen.get(em)+1)+' 条）';
    if(why){
      dups.push('跳过 '+a.name+' '+a.email+'：'+why);
      return;
    }
    seen.set(em,idx);
    nameTaken.add(a.name);
    todo.push(a);
  });
  if(dups.length){
    lines.push('检测到 '+dups.length+' 条重复账号，已剔除：');
    lines.push(...dups);
    res.textContent=lines.join('\n');
  }
  for(let i=0;i<todo.length;i++){
    const a=todo[i];
    try{
      await api('/api/admin/accounts',{method:'POST',body:a});
      lines.push('✓ '+a.name+' '+a.email+' 已提交');
    }catch(e){
      lines.push('✗ '+a.name+' '+a.email+': '+e.message);
    }
    res.textContent=lines.join('\n');
    await new Promise(r=>setTimeout(r,800));
  }
  btn.disabled=false;
  if(!todo.length)lines.push('未提交任何新账号');
  else lines.push('完成：新提交 '+todo.length+' 条');
  res.textContent=lines.join('\n');
  refresh();
}

function fmtSize(b){
  if(!b||b<=0)return '-';
  if(b>=1<<30)return (b/(1<<30)).toFixed(2)+' GB';
  if(b>=1<<20)return (b/(1<<20)).toFixed(1)+' MB';
  return Math.round(b/1024)+' KB';
}
function fmtDur(s){
  if(!s||s<=0)return '-';
  if(s<60)return Math.round(s)+' 秒';
  const m=Math.floor(s/60);const sec=Math.round(s%60);
  return m+' 分 '+sec+' 秒';

    return [
      `<input type="checkbox" ${selVideos.has(v.id)?'checked':''} onchange="toggleVideoSel('${v.id}',this.checked)">`,
      fmt(v.created_at),
      dur,
      dim,
      size,
      v.account||'-',
      v.model||'-',
      state,
      '<span class="prompt" title="'+esc(v.prompt||'')+'">'+esc(v.prompt||'')+'</span>',
      ops
    ];
  });
  q('#videosTable').innerHTML=table(
    ['<input type="checkbox" id="selAllV" onchange="toggleAllVideos(this.checked)" title="全选/取消全选">',
     '生成时间','时长','尺寸','大小','账号','模型','状态','提示词','操作'],rows);
  const b=q('#btnDelVideos');b.disabled=selVideos.size===0;
  b.textContent=selVideos.size?`删除选中（${selVideos.size}）`:'删除选中';
  const selAll=q('#selAllV');
  if(selAll){
    selAll.checked=selVideos.size>0&&selVideos.size===allVideoIds.length;
    selAll.indeterminate=selVideos.size>0&&selVideos.size<allVideoIds.length;
  }
}
function toggleVideoSel(id,on){
  if(on)selVideos.add(id);else selVideos.delete(id);
  const b=q('#btnDelVideos');b.disabled=selVideos.size===0;
  b.textContent=selVideos.size?`删除选中（${selVideos.size}）`:'删除选中';
  const selAll=q('#selAllV');
  if(selAll){
    selAll.checked=selVideos.size>0&&selVideos.size===allVideoIds.length;
    selAll.indeterminate=selVideos.size>0&&selVideos.size<allVideoIds.length;
  }
}
function toggleAllVideos(on){
  selVideos.clear();
  if(on)allVideoIds.forEach(id=>selVideos.add(id));
  loadVideos();
}
async function delVideo(id){
  if(!confirm('确定删除该视频？视频文件与任务记录将一并删除，不可恢复。'))return;
  try{await api('/api/admin/videos/'+id,{method:'DELETE'});}catch(e){alert(e.message);}
  selVideos.delete(id);
  refresh();
}
async function delSelectedVideos(){
  const list=[...selVideos];
  if(!list.length)return;
  if(!confirm(`确定删除选中的 ${list.length} 个视频？文件与任务记录将一并删除，不可恢复。`))return;
  let ok=0;
  for(const id of list){
    try{await api('/api/admin/videos/'+id,{method:'DELETE'});ok++;}
    catch(e){alert(id+' 删除失败：'+e.message);}
  }
  selVideos.clear();
  refresh();
  if(ok)alert(`已删除 ${ok} 个视频（文件与记录）`);
}
async function copyLink(url){
  await copy(url);
  alert('链接已复制');
}

/* ---- API 密钥 ---- */
async function loadKeys(){
  const r=await api('/api/admin/keys');
  const mask=k=>'sk-'+k.slice(3,9)+'…'+k.slice(-4);
  const rows=r.keys.map(k=>[
    '<span style="font-family:monospace">'+mask(k.key)+'</span>',
    k.name||'—',
    (k.allowed_durations||[]).join(' / ')+' 秒',
    (k.daily_limit?`${k.today_total} / ${k.daily_limit}`:`${k.today_total} / 不限`),
    (k.concurrency_limit?`${k.today_active} / ${k.concurrency_limit}`:`${k.today_active} / 不限`)+(k.today_queued?` <span class=\"tiny\">排队 ${k.today_queued}</span>`:''),
    `<label class="sw"><input type="checkbox" ${k.enabled?'checked':''} onchange="setKey('${k.key}',this.checked)"><i></i></label>`,
    fmt(k.last_used_at),
    `<button class="btn" style="margin-right:6px" onclick="copyKey('${k.key}')">复制</button><button class="btn" style="margin-right:6px" onclick="openEditKey('${k.key}')">设置</button><button class="btn btn-danger" onclick="delKey('${k.key}')">删除</button>`
  ]);
  q('#keysTable').innerHTML=table(['Key','名称','允许时长','今日任务','并发','启用','最近使用','操作'],rows)
    +(r.env_keys>0?`<div class="hint" style="margin-top:10px">另有 ${r.env_keys} 个环境变量 key（永久有效，面板只读）</div>`:'');
}
async function setKey(key,on){
  try{await api('/api/admin/keys/'+encodeURIComponent(key),{method:'PATCH',body:{enabled:on}});}catch(e){alert(e.message);}refresh();
}
async function copyKey(key){
  await copy(key);
  alert('已复制 '+(key.slice(0,8)+'…'+key.slice(-4)));
}
async function delKey(key){
  if(!confirm('删除该密钥？调用方将立即失效。'))return;
  try{await api('/api/admin/keys/'+encodeURIComponent(key),{method:'DELETE'});}catch(e){alert(e.message);}refresh();
}
function durationChecks(values){
  values=values||[5,10,15,30];
  return [5,10,15,30].map(v=>`<label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px"><input type="checkbox" id="f_d${v}" ${values.includes(v)?'checked':''}>${v}秒</label>`).join('');
}
function openCreateKey(){
  showDlg(`<h2>创建 API 密钥</h2>
    <label>名称（可选）</label><input id="f_kname" placeholder="例如：客户A">
    <label>每日任务上限（0 = 不限）</label><input id="f_daily" type="number" min="0" value="0">
    <label>同时生成上限（0 = 不限）</label><input id="f_conc" type="number" min="0" value="0">
    <label>允许的视频时长</label><div style="padding:8px 0">${durationChecks()}</div>
    <label>过期时间戳（可选，留空 = 永久）</label><input id="f_exp" type="number" min="0" placeholder="Unix 时间戳">
    <div class="row"><button class="btn" onclick="hide('dlg')">取消</button><button class="btn btn-p" onclick="submitCreateKey()">创建</button></div>`);
}
function selectedDurations(){return [10,15,30].filter(v=>q('#f_d'+v)?.checked);}
async function submitCreateKey(){
  const name=q('#f_kname').value.trim();
  const allowed=selectedDurations();
  if(!allowed.length)return alert('至少选择一个视频时长');
  const body={name,daily_limit:Number(q('#f_daily').value||0),concurrency_limit:Number(q('#f_conc').value||0),allowed_durations:allowed};
  const exp=q('#f_exp').value.trim();if(exp)body.expires_at=Number(exp);
  try{
    const r=await api('/api/admin/keys',{method:'POST',body});
    const k=r.created.key;
    hide('dlg');
    showDlg(`<h2>创建成功，请保存密钥</h2>
      <div class="tiny">完整 key 只在此显示一次：</div>
      <div class="keyfull" id="newKey">${esc(k)}</div>
      <div class="row"><button class="btn" onclick="copyFromNewKey()">复制</button><button class="btn btn-p" onclick="hide('dlg');loadKeys()">完成</button></div>`);
  }catch(e){alert(e.message);}
}
async function openEditKey(key){
  const r=await api('/api/admin/keys');const k=r.keys.find(x=>x.key===key);if(!k)return;
  showDlg(`<h2>设置 API 密钥</h2>
    <div class="tiny" style="margin-bottom:8px">${esc(k.name||key)}</div>
    <label>每日任务上限（0 = 不限）</label><input id="f_daily" type="number" min="0" value="${k.daily_limit}">
    <label>同时生成上限（0 = 不限）</label><input id="f_conc" type="number" min="0" value="${k.concurrency_limit}">
    <label>允许的视频时长</label><div style="padding:8px 0">${durationChecks(k.allowed_durations)}</div>
    <label>过期时间戳（0 = 永久）</label><input id="f_exp" type="number" min="0" value="${k.expires_at||0}">
    <div class="row"><button class="btn" onclick="hide('dlg')">取消</button><button class="btn btn-p" onclick="submitEditKey('${key}')">保存</button></div>`);
}
async function submitEditKey(key){
  const allowed=selectedDurations();if(!allowed.length)return alert('至少选择一个视频时长');
  try{await api('/api/admin/keys/'+encodeURIComponent(key),{method:'PATCH',body:{daily_limit:Number(q('#f_daily').value||0),concurrency_limit:Number(q('#f_conc').value||0),allowed_durations:allowed,expires_at:Number(q('#f_exp').value||0)}});hide('dlg');refresh();}catch(e){alert(e.message);}
}
function copyFromNewKey(){copy(q('#newKey').textContent.trim());}
async function copy(text){
  try{await navigator.clipboard.writeText(text);}catch(e){
    const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
}

function showDlg(html){q('#dlgBox').innerHTML=html;show('dlg');}

/* ---- 压力测试 ---- */
let stressPollTimer=null;
function stopStressPoll(){if(stressPollTimer){clearInterval(stressPollTimer);stressPollTimer=null;}}
function openStress(){
  showDlg(`<h2>压力测试</h2>
    <p class="tiny" style="line-height:1.7;margin-bottom:10px">模拟“多个账号/视频任务同时拉起浏览器”：服务器会从 1 个开始，
    逐级同时拉起 1、2、3…N 个 headed Chromium（临时 profile，使用与账号登录相同的浏览器参数；
    不访问 Google/dola，不消耗任何号池额度），并统计操作系统里真实拉起的浏览器主进程数、
    Chromium 总进程数、内存峰值和系统剩余内存，得出当前可稳定并发的浏览器数。</p>
    <label>最大测试级数（默认 8，最大 12）</label>
    <input id="stressMax" type="number" min="1" max="12" value="8">
    <div class="hint" style="margin-top:4px">测试期间请不要同时进行真实账号登录/视频任务。</div>
    <div id="stressOut" class="tiny" style="margin-top:10px;white-space:pre-wrap;max-height:230px;overflow:auto;background:#f5f7f6;border-radius:8px;padding:10px"></div>
    <div class="row"><button class="btn" onclick="stopStressPoll();hide('dlg')">关闭</button>
      <button class="btn btn-p" id="stressStartBtn" onclick="startStress()">开始压测</button></div>`);
  loadStressStatus(true);
}
async function loadStressStatus(showLogs){
  try{
    const st=await api('/api/admin/stress');
    const out=q('#stressOut');if(!out)return;
    const lines=[];
    if(st.busy_tasks>0)lines.push('⚠ 当前有 '+st.busy_tasks+' 个视频任务在排队/运行，压测会被拒绝，建议等空闲后再试。');
    if(st.running_jobs>0)lines.push('⚠ 当前有账号登录任务进行中，压测会被拒绝。');
    if(st.status==='running'){
      lines.push('压测运行中，正在逐级拉起浏览器…请稍候');
      if(st.logs&&st.logs.length)lines.push('---\n'+st.logs.join('\n'));
      const btn=q('#stressStartBtn');if(btn)btn.disabled=true;
    }else{
      if(stressPollTimer){clearInterval(stressPollTimer);stressPollTimer=null;}
      const btn=q('#stressStartBtn');if(btn)btn.disabled=false;
      if(st.status==='completed'){
        lines.push('✅ 推荐并发：'+st.recommended+' 个浏览器');
        if(st.logs&&st.logs.length)lines.push('---\n'+st.logs.join('\n'));
      }else if(st.status==='failed'){
        if(st.logs&&st.logs.length)lines.push('压测失败：\n'+st.logs.join('\n'));
      }else if(showLogs&&st.logs&&st.logs.length){
        lines.push(st.logs.join('\n'));
      }
    }
    out.textContent=lines.join('\n');
  }catch(e){}
}
async function startStress(){
  const btn=q('#stressStartBtn');btn.disabled=true;
  const n=Math.min(12,Math.max(1,parseInt(q('#stressMax').value||'8',10)));
  try{
    await api('/api/admin/stress',{method:'POST',body:{max_concurrency:n,hold_seconds:5}});
    q('#stressOut').textContent='压测已开始：1→'+n+' 个浏览器逐级同时拉起…';
    stressPollTimer=setInterval(()=>loadStressStatus(false),2500);
  }catch(e){alert(e.message);btn.disabled=false;}
}

/* 启动：探测鉴权，401 才弹登录遮罩（ADMIN_KEY 留空时免登录） */
(async function boot(){
  try{ await api('/api/admin/accounts'); hide('loginMask'); refresh(); }
  catch(e){ /* 401 已在 api() 内触发 showLogin */ }
})();
timer=setInterval(()=>{if(autoRefresh)refresh();},10000);
</script>
